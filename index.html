<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>피렌체 크리스</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f2f2f2; font-family: -apple-system, sans-serif; color: #191919; }
        .container {
            max-width: 500px; margin: 0 auto; background: #fff;
            min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center;
            padding: 48px 28px 40px;
        }
        .header-title { font-size: 22px; font-weight: bold; margin-bottom: 32px; text-align: center; }
        .qr-wrap {
            width: 100%; max-width: 320px;
            border: 1px solid #eee; border-radius: 16px;
            overflow: hidden; margin-bottom: 28px;
        }
        .qr-wrap img { width: 100%; display: block; }
        .desc {
            font-size: 14px; color: #444; line-height: 1.8;
            text-align: center; margin-bottom: 36px; padding: 0 4px;
        }
        .btn-reserve {
            display: block; width: 100%; max-width: 320px;
            background: #fee500; border: none; border-radius: 14px;
            padding: 18px; font-size: 17px; font-weight: bold;
            color: #191919; text-align: center; text-decoration: none;
            cursor: pointer; transition: background 0.15s;
        }
        .btn-reserve:active { background: #f0d800; }
        @media (min-width: 501px) { body { background-color: #e5e5e5; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header-title">피렌체 크리스</div>
    <div class="qr-wrap">
        <img src="crispass_qr.png" alt="크리스패스 QR">
    </div>
    <div class="desc">
        크리스패스 이미지를 보여만 주셔도<br>
        제휴된 식당에서 시간대별로<br>
        할인 적용을 받으실 수 있습니다.
    </div>
    <a href="restaurants.html" class="btn-reserve">예약 / 확인 / 취소</a>
</div>
</body>
</html>
